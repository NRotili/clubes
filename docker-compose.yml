services:

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
    volumes:
      - storage_uploads:/var/www/html/storage/app/public
    networks:
      - villarugbyclub_internal
      - general_network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-clubes}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - villarugbyclub_internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      target: app
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      SKIP_SETUP: "true"
    volumes:
      - storage_uploads:/var/www/html/storage/app/public
    networks:
      - villarugbyclub_internal
    depends_on:
      app:
        condition: service_healthy

networks:
  villarugbyclub_internal:
    driver: bridge
  general_network:
    external: true

volumes:
  mysql_data:
  storage_uploads:
