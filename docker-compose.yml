services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - public_data:/var/www/public
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    networks:
      - magiasabor_internal
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_data:/var/www/html/public:ro
    networks:
      - magiasabor_internal
      - general_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-clubes}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - magiasabor_internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build: .
    restart: unless-stopped
    command: ["php", "artisan", "queue:listen", "--tries=3", "--timeout=90"]
    env_file: .env
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    networks:
      - magiasabor_internal
    depends_on:
      - app

networks:
  magiasabor_internal:
    driver: bridge
  general_network:
    external: true

volumes:
  public_data:
  mysql_data:
  storage_app:
  storage_logs:
